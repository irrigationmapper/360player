<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>360 Video</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    #player, #player iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
    /* Transparent drag surface; leaves the bottom 70px free for YouTube's controls */
    #drag { position: fixed; top: 0; left: 0; right: 0; bottom: 70px; z-index: 2;
      cursor: grab; touch-action: none; }
    #drag.dragging { cursor: grabbing; }
    #label, #status { position: fixed; left: 12px; z-index: 3; pointer-events: none;
      padding: 6px 12px; border-radius: 6px; background: rgba(0,0,0,.6); color: #fff;
      font-size: 14px; line-height: 1.3; transition: opacity .6s; }
    #label { top: 12px; }
    #label small { display: block; opacity: .75; font-size: 12px; }
    #status { bottom: 84px; display: none; max-width: 80vw; }
    #drag.off { pointer-events: none; cursor: default; }
    #bar { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); z-index: 4;
      display: flex; gap: 6px; white-space: nowrap; }
    #bar button { padding: 5px 10px; white-space: nowrap;
      border: 0; border-radius: 6px; background: rgba(0,0,0,.65); color: #fff;
      font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; cursor: pointer; }
    #bar button:hover { background: rgba(0,0,0,.85); }
    #msg { color: #ccc; display: none; position: fixed; inset: 0; align-items: center;
      justify-content: center; text-align: center; padding: 24px; }
  </style>
</head>
<body>
  <div id="player"></div>
  <div id="drag" title="Drag to look around. Click to play or pause."></div>
  <div id="label"></div>
  <div id="status"></div>
  <div id="bar">
    <button id="speed" type="button" title="Change playback speed">Speed 1×</button>
    <button id="mode" type="button">Quality &amp; controls</button>
  </div>
  <div id="msg">No video selected. Open this page from a map point.</div>

  <script>
    const q = new URLSearchParams(location.search);
    const v = (q.get('v') || '').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 11);
    const t = Math.max(0, parseInt(q.get('t') || '0', 10) || 0);
    const area = (q.get('a') || '').slice(0, 80);
    const autoplay = q.get('autoplay') === '1' ? 1 : 0;
    const SPEEDS = [0.25, 0.5, 0.75, 1, 1.25, 1.5, 2];
    let speed = parseFloat(q.get('speed') || '1');
    if (!SPEEDS.includes(speed)) speed = 1;

    const label = document.getElementById('label');
    const status = document.getElementById('status');
    const drag = document.getElementById('drag');

    function showStatus(text, ms) {
      status.textContent = text;
      status.style.display = 'block';
      status.style.opacity = '1';
      if (ms) setTimeout(() => { status.style.opacity = '0'; }, ms);
    }

    if (!v) {
      ['player', 'drag', 'label', 'status', 'bar'].forEach(id => document.getElementById(id).remove());
      document.getElementById('msg').style.display = 'flex';
    } else {
      const mm = Math.floor(t / 60), ss = String(t % 60).padStart(2, '0');
      if (area) {
        label.textContent = area;
        const sm = document.createElement('small');
        sm.textContent = `Starts at ${mm}:${ss} · Drag to look around`;
        label.appendChild(sm);
        document.title = `${area} – 360 Video`;
      } else {
        label.textContent = `Starts at ${mm}:${ss} · Drag to look around`;
      }
      setTimeout(() => { label.style.opacity = '0'; }, 6000);

      // Load the YouTube IFrame Player API
      const s = document.createElement('script');
      s.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(s);
    }

    let speedSet = false;
    let player, view = { yaw: 0, pitch: 0, roll: 0, fov: 100 }, is360 = null;

    window.onYouTubeIframeAPIReady = function () {
      player = new YT.Player('player', {
        videoId: v,
        playerVars: { start: t, mute: 1, rel: 0, playsinline: 1, autoplay: autoplay,
                      origin: location.origin },
        events: {
          onReady: () => { applySpeed(); if (autoplay) { player.mute(); player.playVideo(); } },
          onStateChange: (e) => {
            if (e.data === YT.PlayerState.PLAYING && !speedSet) { speedSet = true; enforceSpeed(0); }
            if (e.data === YT.PlayerState.PLAYING && is360 === null) {
              // Spherical properties are only available once a 360 video is playing
              setTimeout(check360, 800);
            }
          }
        }
      });
    };

    function check360() {
      const p = player.getSphericalProperties ? player.getSphericalProperties() : null;
      if (p && typeof p.yaw === 'number') {
        is360 = true;
        view = { yaw: p.yaw, pitch: p.pitch || 0, roll: 0, fov: p.fov || 100 };
        showStatus('360 view active · drag to look around · scroll to zoom', 4000);
      } else {
        is360 = false;
        showStatus('This player is not showing the video in 360. Report this result.', 0);
      }
    }

    const speedBtn = document.getElementById('speed');
    function applySpeed() {
      if (player && player.setPlaybackRate) player.setPlaybackRate(speed);
      if (speedBtn) speedBtn.textContent = `Speed ${speed}×`;
    }
    // YouTube can reset the rate while a video starts; retry until it sticks
    function enforceSpeed(tries) {
      applySpeed();
      setTimeout(() => {
        if (!player || !player.getPlaybackRate) return;
        const now = player.getPlaybackRate();
        if (now === speed) {
          if (speed !== 1) showStatus(`Playback speed ${speed}×`, 2000);
        } else if (tries < 6) {
          enforceSpeed(tries + 1);
        } else {
          const avail = (player.getAvailablePlaybackRates && player.getAvailablePlaybackRates()) || [];
          showStatus(`Speed ${speed}× not accepted (playing at ${now}×). Available: ${avail.join(', ') || 'unknown'}`, 0);
        }
      }, 500);
    }
    if (speedBtn) {
      speedBtn.textContent = `Speed ${speed}×`;
      speedBtn.addEventListener('click', () => {
        speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length];
        applySpeed();
        showStatus(`Playback speed ${speed}×`, 1500);
      });
    }

    function apply() {
      if (player && is360) player.setSphericalProperties(view);
    }

    // Drag to look around; a click without dragging toggles play/pause
    let down = null;
    drag.addEventListener('pointerdown', (e) => {
      drag.setPointerCapture(e.pointerId);
      down = { x: e.clientX, y: e.clientY, yaw: view.yaw, pitch: view.pitch, moved: false };
      drag.classList.add('dragging');
    });
    drag.addEventListener('pointermove', (e) => {
      if (!down) return;
      const dx = e.clientX - down.x, dy = e.clientY - down.y;
      if (Math.abs(dx) + Math.abs(dy) > 4) down.moved = true;
      const k = view.fov / window.innerWidth; // degrees per pixel scales with zoom
      view.yaw = ((down.yaw + dx * k) % 360 + 360) % 360;
      view.pitch = Math.max(-90, Math.min(90, down.pitch + dy * k));
      apply();
    });
    function endDrag() {
      if (!down) return;
      const wasClick = !down.moved;
      down = null;
      drag.classList.remove('dragging');
      if (wasClick && player && player.getPlayerState) {
        const st = player.getPlayerState();
        st === YT.PlayerState.PLAYING ? player.pauseVideo() : player.playVideo();
      }
    }
    drag.addEventListener('pointerup', endDrag);
    drag.addEventListener('pointercancel', endDrag);

    // Toggle between drag mode and YouTube controls mode (settings gear, quality, captions)
    const modeBtn = document.getElementById('mode');
    if (modeBtn) modeBtn.addEventListener('click', () => {
      const controls = !drag.classList.contains('off');
      drag.classList.toggle('off', controls);
      modeBtn.textContent = controls ? 'Back to drag to look' : 'Quality & controls';
      showStatus(controls
        ? 'YouTube controls active · use the gear for quality · click "Back to drag to look" when done'
        : 'Drag to look around', 4000);
    });

    // Scroll to zoom
    drag.addEventListener('wheel', (e) => {
      e.preventDefault();
      view.fov = Math.max(30, Math.min(120, view.fov + (e.deltaY > 0 ? 5 : -5)));
      apply();
    }, { passive: false });

    // Arrow keys to look around
    window.addEventListener('keydown', (e) => {
      const step = 10;
      if (e.key === 'ArrowLeft')  view.yaw = (view.yaw - step + 360) % 360;
      else if (e.key === 'ArrowRight') view.yaw = (view.yaw + step) % 360;
      else if (e.key === 'ArrowUp')    view.pitch = Math.min(90, view.pitch + step);
      else if (e.key === 'ArrowDown')  view.pitch = Math.max(-90, view.pitch - step);
      else return;
      apply();
    });
  </script>
</body>
</html>
