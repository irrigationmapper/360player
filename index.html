<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>360 Video</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
    #label {
      position: fixed; top: 12px; left: 12px; z-index: 2;
      padding: 6px 12px; border-radius: 6px;
      background: rgba(0,0,0,.6); color: #fff; font-size: 14px; line-height: 1.3;
      pointer-events: none; transition: opacity .6s;
    }
    #label small { display: block; opacity: .75; font-size: 12px; }
    #msg { color: #ccc; display: none; position: fixed; inset: 0; align-items: center; justify-content: center; text-align: center; padding: 24px; }
  </style>
</head>
<body>
  <div id="label"></div>
  <div id="msg">No video selected. Open this page from a map point.</div>
  <iframe id="player"
    title="360 video player"
    allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture; fullscreen; web-share"
    allowfullscreen
    referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <script>
    const q = new URLSearchParams(location.search);
    const v = (q.get('v') || '').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 11);
    const t = Math.max(0, parseInt(q.get('t') || '0', 10) || 0);
    const area = (q.get('a') || '').slice(0, 80);
    const autoplay = q.get('autoplay') === '1' ? 1 : 0;

    const player = document.getElementById('player');
    const label = document.getElementById('label');

    if (!v) {
      player.remove();
      label.remove();
      document.getElementById('msg').style.display = 'flex';
    } else {
      player.src = `https://www.youtube.com/embed/${v}?start=${t}&mute=1&rel=0&playsinline=1&autoplay=${autoplay}`;
      const mm = Math.floor(t / 60), ss = String(t % 60).padStart(2, '0');
      if (area) {
        label.textContent = area;
        const sm = document.createElement('small');
        sm.textContent = `Starts at ${mm}:${ss} · Drag to look around`;
        label.appendChild(sm);
        document.title = `${area} – 360 Video`;
      } else {
        label.textContent = `Starts at ${mm}:${ss} · Drag to look around`;
      }
      setTimeout(() => { label.style.opacity = '0'; }, 6000);
    }
  </script>
</body>
</html>
